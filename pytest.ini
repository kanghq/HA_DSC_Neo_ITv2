[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
markers =
    protocol: pure-Python protocol-layer tests (no Home Assistant required)
    ha: tests that require pytest-homeassistant-custom-component
filterwarnings =
    ignore::DeprecationWarning:homeassistant.*
